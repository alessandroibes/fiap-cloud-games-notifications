name: fcg-notifications-local
services:
  notifications:
    image: fiap-cloud-games-notifications:local
    build: .
    environment:
      ConnectionStrings__Notifications: ${NOTIFICATIONS_DOCKER_CONNECTION:?Configure .env}
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__VirtualHost: fcg
      RabbitMq__Username: ${RabbitMq__Username:?Configure .env}
      RabbitMq__Password: ${RabbitMq__Password:?Configure .env}
    ports: ["127.0.0.1:5084:8080"]
    networks: [fcg]
    restart: unless-stopped
networks:
  fcg:
    external: true
    name: fiap-cloud-games_default
